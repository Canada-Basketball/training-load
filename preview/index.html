const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// Same recipe as scripts/crypto_util.py, done with the browser's built-in WebCrypto.
// The page is encrypted once with a random key. That key is stored once per password ("wrapped"), each
// copy labelled with the role it gives. The password you type is stretched with PBKDF2 (600,000 rounds)
// and tried on each copy; the one that opens gives the page key, and the page opens with that role.
// A wrong password opens none of them, so decrypt() throws and the handler says "Incorrect password".
async function aesKey(pw, e) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(e.s), iterations: e.n, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function unlock(pw) {
  for (const e of P.k) {
    let raw;
    try { raw = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(e.i) }, await aesKey(pw, e), b64(e.c)); }
    catch (x) { continue; }   // not this password's copy; try the next
    const pageKey = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.i) }, pageKey, b64(P.c));
    return { html: new TextDecoder().decode(buf), role: e.r };
  }
  throw new Error("wrong password");
}
// Once decrypted, replace this whole page with the real dashboard.
// The password is never written to disk or browser storage. It is kept in memory for this tab only
// (window.__tlpw), so the dashboard can send it to the notes service; closing the tab forgets it.
// window.__tlrole tells the dashboard which controls to show. The notes service checks the password
// itself, so this is only for display.
async function open(pw) {
  const { html, role } = await unlock(pw);
  window.__tlpw = pw;
  window.__tlrole = role;
  document.open(); document.write(html); document.close();
}
// Sandboxed viewers block form submission, so use a click/Enter handler instead.
async function submit() {
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try { await open(document.getElementById("pw").value); }
  catch (x) { err.textContent = "Incorrect password."; btn.disabled = false; }
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); submit(); });
document.getElementById("go").addEventListener("click", submit);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); submit(); } });
try { sessionStorage.removeItem("tl-pw"); } catch (e) {}  // clear what older versions stored
