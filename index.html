const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// Same recipe as scripts/crypto_util.py, done with the browser's built-in WebCrypto.
// The page is encrypted once with a random key. That key is stored once per password ("wrapped"), each
// copy labelled with the role it gives. The password you type is stretched with PBKDF2 (600,000 rounds)
// and tried on each copy; the one that opens gives the page key, and the page opens with that role.
// A wrong password opens none of them, so decrypt() throws and the handler says "Incorrect password".
async function aesKey(pw, e) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(e.s), iterations: e.n, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function unlock(pw) {
  for (const e of P.k) {
    let raw;
    try { raw = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(e.i) }, await aesKey(pw, e), b64(e.c)); }
    catch (x) { continue; }   // not this password's copy; try the next
    const pageKey = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.i) }, pageKey, b64(P.c));
    return { html: new TextDecoder().decode(buf), role: e.r };
  }
  throw new Error("wrong password");
}
// Once decrypted, replace this whole page with the real dashboard.
// The password is never written to disk or browser storage. It is kept in memory for this tab only
// (window.__tlpw), so the dashboard can send it to the notes service; closing the tab forgets it.
// window.__tlrole tells the dashboard which controls to show. The notes service checks the password
// itself, so this is only for display.
async function open(pw) {
  const { html, role } = await unlock(pw);
  window.__tlpw = pw;
  window.__tlrole = role;
  document.open(); document.write(html); document.close();
}
// Sandboxed viewers block form submission, so use a click/Enter handler instead.
async function submit() {
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try { await open(document.getElementById("pw").value); }
  catch (x) { err.textContent = "Incorrect password."; btn.disabled = false; }
}
document.getElementById("go").addEventListener("click", submit);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); submit(); } });

// ---------- accounts (pages published with PAGE_KEY) ----------
// The page is locked with a key that only the notes service holds. Signing in with an approved account makes the
// service hand over that key (and your role); a session token is kept for this tab so a refresh doesn't ask again.
// Closing the tab forgets the token. The password is never stored.
const $ = id => document.getElementById(id);
let mode = "in";
function setMode(m) {
  mode = m;
  $("tabIn").classList.toggle("on", m === "in" || m === "reset"); $("tabUp").classList.toggle("on", m === "up");
  $("un").hidden = m !== "up";
  $("forgot").hidden = m !== "in";
  $("ap").autocomplete = m === "in" ? "current-password" : "new-password";
  $("ap").placeholder = m === "reset" ? "New password (10+ characters)" : "Password";
  $("acctGo").textContent = m === "up" ? "Create account" : m === "reset" ? "Request new password" : "Sign in";
  $("acctHelp").textContent = m === "up" ? "Create an account. You can sign in once an admin has approved it."
    : m === "reset" ? "Choose a new password. An admin needs to approve it before it works; your old one still works until then."
    : "Protected dashboard. Sign in with your email.";
  $("err").textContent = ""; $("ok").textContent = "";
}
async function openWithKey(keyB64, info, token) {
  const pageKey = await crypto.subtle.importKey("raw", b64(keyB64), "AES-GCM", false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.i) }, pageKey, b64(P.c));
  window.__tltoken = token; window.__tlrole = info.role; window.__tlname = info.name;
  document.open(); document.write(new TextDecoder().decode(buf)); document.close();
}
async function api(path, opts) {
  let res;
  try { res = await fetch(P.u + path, opts); } catch (x) { throw new Error("Can't reach the sign-in service. Check your connection and try again."); }
  let body = {};
  try { body = await res.json(); } catch (x) {}
  if (!res.ok) { const e = new Error(body.detail || "Something went wrong (" + res.status + ")"); e.status = res.status; throw e; }
  return body;
}
async function acctSubmit() {
  const btn = $("acctGo"), err = $("err"), ok = $("ok");
  btn.disabled = true; err.textContent = ""; ok.textContent = "";
  const body = { email: $("em").value.trim(), password: $("ap").value };
  try {
    if (mode === "up") {
      body.username = $("un").value.trim();
      await api("/api/signup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      $("ap").value = ""; setMode("in"); ok.textContent = "Account created. Ask an admin to approve it, then sign in.";
    } else if (mode === "reset") {
      const r = await api("/api/forgot", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      $("ap").value = ""; setMode("in"); ok.textContent = r.message;
    } else {
      const r = await api("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      try { sessionStorage.setItem("tl-token", r.token); } catch (x) {}
      await openWithKey(r.key, r, r.token);
      return;
    }

}
async function resume() {

    await openWithKey(r.key, r, token);
  } catch (x) {
    if (x.status === 401 || x.status === 403) { try { sessionStorage.removeItem("tl-token"); } catch (y) {} if (x.status === 403) $("err").textContent = x.message; }
  }
}
if (P && P.v === 3) {
  $("legacy").hidden = true; $("acct").hidden = false;
  $("tabIn").addEventListener("click", () => setMode("in"));
  $("tabUp").addEventListener("click", () => setMode("up"));
  $("forgot").addEventListener("click", e => { e.preventDefault(); setMode("reset"); });
  $("acctGo").addEventListener("click", acctSubmit);
  for (const id of ["em", "un", "ap"]) $(id).addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); acctSubmit(); } });
  $("em").focus();
  resume();
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); if (P && P.v === 3) acctSubmit(); else submit(); });
if (!(P && P.v === 3)) { try { sessionStorage.removeItem("tl-pw"); } catch (e) {} }   // clear what older versions stored
